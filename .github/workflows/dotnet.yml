
name: .NET Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore HunterGrassServices.Tests/HunterGrassServices.Tests.csproj

      - name: Build application and tests
        run: dotnet build HunterGrassServices.Tests/HunterGrassServices.Tests.csproj --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test HunterGrassServices.Tests/HunterGrassServices.Tests.csproj --configuration Release --no-build --verbosity normal
